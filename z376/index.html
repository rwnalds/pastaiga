<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Z376 · Pastaiga pa māju</title>
<style>
:root{--panel:rgba(16,21,27,.74);--fg:#f3f1ec;--mut:#b9c0c8;--line:rgba(255,255,255,.22);--acc:#e8b04a}
html,body{margin:0;height:100%;overflow:hidden;background:#10151b;color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
#c{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--panel);padding:6px 14px;border-radius:20px;font-weight:600;pointer-events:none;white-space:nowrap}
#map{position:fixed;top:12px;right:12px;width:190px;height:180px;background:var(--panel);border-radius:10px;pointer-events:none}
#bar{position:fixed;left:12px;bottom:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap}
#bar button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
#bar button:hover{border-color:var(--acc)}
#bar button.on{border-color:var(--acc);color:var(--acc)}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,18,.55);cursor:pointer}
#start .box{background:var(--panel);padding:20px 24px;border-radius:14px;max-width:460px;margin:16px;text-align:center}
#start h1{font-size:20px;margin:0 0 8px}
#start p{margin:6px 0;color:var(--mut)}
#start b{color:var(--fg)}
#start .credit{font-size:12px;margin-top:12px;opacity:.8}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.75);pointer-events:none}
#joy{position:fixed;width:110px;height:110px;margin:-55px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(255,255,255,.45)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:16px}
@media (max-width:600px){#map{width:120px;height:114px}#hud{top:auto;bottom:96px;font-size:12px}#bar button{padding:5px 8px;font-size:12px}}
</style>
</head>

    const l=-w/2+(arms.includes('l')?aw:0),r=w/2-(arms.includes('r')?aw:0),n=Math.max(1,Math.round((r-l)/.85)),cw=(r-l)/n;
    rb(g,0,.18,0,w,.16,d,M.fabric,.03);for(const sx of[-1,1])for(const sz of[-1,1])cy(g,sx*(w/2-.08),.05,sz*(d/2-.08),.025,.02,.1,M.dark);

  wardrobe(f){pbox(...f.r,0,2.25,M.cabinet,{col:true});if(!f.back)return;const [g,w,d]=place(f.r,f.back),n=Math.max(1,Math.round(w/.5));
    for(let i=1;i<n;i+=2){const x=-w/2+w*i/n;for(const s of[-1,1])cy(g,x+s*.035,1.15,d/2+.02,.008,.008,.3,MD.panel);}},
};
// hob burners, oven front and a gooseneck tap on counters that ask for them
const counterBase=F.counter;
FD.counter=f=>{counterBase(f);const r=f.r,[x0,z0,x1,z1]=[X(r[0]),Z(r[1]),X(r[2]),Z(r[3])];
  if(f.hob){const cz=(z0+z1)/2,cx=(x0+x1)/2;for(const [dx,dz] of[[-.12,-.15],[.12,-.15],[-.12,.15],[.12,.15]])put(scene,new THREE.TorusGeometry(.065,.006,6,24),MD.panel,cx+dx*.6,.908,cz+dz,{rx:Math.PI/2});
    const fx=f.upper==='w'?x1+.002:x0-.002;rb(scene,fx,.48,cz,.01,.5,.56,MD.glassDark,.005);rb(scene,f.upper==='w'?fx+.02:fx-.02,.78,cz,.02,.02,.4,M.steel,.008);}
  if(f.sink){const cx=(x0+x1)/2-.4;cy(scene,cx,1.05,z1-.07,.014,.016,.3,M.steel);put(scene,new THREE.TorusGeometry(.09,.012,8,20,Math.PI),M.steel,cx,1.2,z1-.16,{ry:Math.PI/2});}};
Object.assign(F,FD);
for(const f of H.furniture){(F[f.t]||(()=>{}))(f);if(NOBLOB.has(f.t))continue;
  if(f.r)blob(X(f.r[0]),Z(f.r[1]),X(f.r[2]),Z(f.r[3]));else if(f.p)blob(X(f.p[0])-.22,Z(f.p[1])-.22,X(f.p[0])+.22,Z(f.p[1])+.22,.1);}

// ---------- outside ----------
const O=H.outside||{};
const roofGroup=new THREE.Group();scene.add(roofGroup);
const ground=mplane(-120,-120,120,120,-.03,tm(TX.grass,60,60,{roughness:1}));
if(O.terrace){const [a,b,c,d]=O.terrace;pbox(a,b,c,d,-.2,-.005,tm(TX.deck,1/1.2,1/1.2),{cast:false});}
if(O.canopy){const [a,b,c,d]=O.canopy;pbox(a,b,c,d,2.62,2.86,M.dark,{parent:roofGroup});
  for(const [px,py] of O.posts||[])pbox(px-12,py-12,px+12,py+12,0,2.62,M.cladWood,{col:true});}
if(O.stoop){const [a,b,c,d]=O.stoop;pbox(a,b,c,d,-.2,-.01,tm(TX.paving,1,1),{cast:false});}

for(const h of O.hedges||[]){const [a,b,c,d]=h;pbox(a,b,c,d,0,.65,M.leaf,{col:true});}
// gravel border + ornamental grass round the house
{const [a,b,c,d]=H.slab;mplane(X(a)-1.2,Z(b)-.1,X(c)+1.2,Z(d)+1.2,-.02,tm(TX.gravel,8,6));}
const grassClumps=new THREE.InstancedMesh(new THREE.ConeGeometry(.16,.55,5),M.straw,60);{let i=0;const m4=new THREE.Matrix4();
  const [a,b,c,d]=H.slab;for(;i<60;i++){const side=i%3;let x,z;
    if(side===0){x=X(a)-.7;z=Z(b)+rnd()*(Z(d)-Z(b));}else if(side===1){x=X(c)+.7;z=Z(b)+rnd()*(Z(d)-Z(b));}
    else{x=X(a)+rnd()*(X(c)-X(a));z=Z(d)+1.0+rnd()*.3;if(O.stoop&&x>X(O.stoop[0])-.3&&x<X(O.stoop[2])+.3)x=X(c)+.7;}
    m4.makeTranslation(x,.37,z);grassClumps.setMatrixAt(i,m4);}grassClumps.castShadow=true;scene.add(grassClumps);}
for(const cl of O.cladding||[]){const wr=H.walls.find(w=>w.outer===cl.side);if(!wr)continue;const [x0,y0,x1,y1]=wr.r;
  const m=cl.kind==='slats'?M.slats:cl.kind==='wood'?M.cladWood:M.panel;const [y_0,y_1]=cl.y;
  if(cl.side==='n'||cl.side==='s'){const z=cl.side==='n'?Z(y0)-.03:Z(y1)+.03;
    if(cl.kind==='slats'){for(let x=X(cl.a[0]);x<X(cl.a[1])-.03;x+=.09)mbox(x,z-.03,x+.045,z+.03,y_0,y_1,m);}
    else mbox(X(cl.a[0]),z-.02,X(cl.a[1]),z+.02,y_0,y_1,m);}
  else{const x=cl.side==='w'?X(x0)-.03:X(x1)+.03;mbox(x-.02,Z(cl.a[0]),x+.02,Z(cl.a[1]),y_0,y_1,m);}}
// plot: fence, gate gap, trees
if(O.plot){const [x0,z0,x1,z1]=O.plot,g=O.gate||[0,0];
  const run=(ax,za,zb,c,horiz)=>{for(let a=za;a<zb-.01;a+=2.4){const b=Math.min(zb,a+2.4);
    if(horiz&&c===z1&&b>g[0]&&a<g[1])continue;const r=(u0,u1,y0,y1,col)=>horiz?mbox(u0,c-.025,u1,c+.025,y0,y1,M.cladWood,{col}):mbox(c-.025,u0,c+.025,u1,y0,y1,M.cladWood,{col});r(a,a+.08,0,1.1,true);for(const y of[.3,.62,.94])r(a,b,y,y+.12,true);}};
  run(0,x0,x1,z0,true);run(0,x0,x1,z1,true);run(0,z0,z1,x0,false);run(0,z0,z1,x1,false);
  for(let i=0;i<70;i++){const ang=rnd()*Math.PI*2,rad=24+rnd()*30,x=Math.cos(ang)*rad,z=Math.sin(ang)*rad,h=9+rnd()*9;
    const c=new THREE.Mesh(new THREE.ConeGeometry(h*.2,h,8),M.conifer);c.position.set(x,h/2,z);c.castShadow=i<30;scene.add(c);}
  for(let i=0;i<10;i++){const x=x0+1+rnd()*(x1-x0-2),z=(i%2?z0+1.2:z1-1.2)+(rnd()-.5);if(Math.abs(x-(g[0]+g[1])/2)<2.5)continue;
    const t=new THREE.Mesh(new THREE.CylinderGeometry(.1,.15,1.6,8),M.trunk);t.position.set(x,.8,z);scene.add(t);
    const l=new THREE.Mesh(new THREE.IcosahedronGeometry(1.1,1),rnd()<.5?M.leaf:M.leaf2);l.position.set(x,2.3,z);l.castShadow=true;scene.add(l);colliders.push([x-.2,z-.2,x+.2,z+.2]);}}

// ---------- roof ----------
if(H.roof){const R=H.roof,[a,b,c,d]=R.r,x0=X(a),x1=X(c),z0=Z(b),z1=Z(d),half=(z1-z0)/2,zc=(z0+z1)/2;
  const p=R.pitch*Math.PI/180,rise=half*Math.tan(p),len=Math.hypot(half,rise),E=R.eave,rm=tm(TX.roof,(x1-x0)/1.2,len/1.2,{roughness:.7});
  for(const side of[-1,1]){const g=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,.16,len),rm);g.position.set((x0+x1)/2,E+rise/2+.08,zc+side*half/2);

  mbox(x0,z0,x1,z1,E-.06,E-.02,M.render,{parent:roofGroup});           // soffit
  mbox(x0,z0-.04,x1,z0,E-.2,E,M.dark,{parent:roofGroup});mbox(x0,z1,x1,z1+.04,E-.2,E,M.dark,{parent:roofGroup}); // gutters
  const [wa,wb,wc,wd]=R.walls,za=Z(wb),zb=Z(wd),h=z=>E+(half-Math.abs(z-zc))*Math.tan(p);

    const t=(46/S),gm=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:t,bevelEnabled:false}),M.render);gm.rotation.y=Math.PI/2;
    gm.position.set(px===wa?X(wa):X(wc)-t,0,0);gm.castShadow=true;roofGroup.add(gm);}
  if(R.chimney){const [ca,cb,cc,cd]=R.chimney;pbox(ca,cb,cc,cd,IN_H,E+rise+.7,M.panel,{parent:roofGroup});}}

// ---------- player / controls ----------
const player={x:0,z:0,yaw:0,pitch:0};
function go(spot){player.x=X(spot.p[0]);player.z=Z(spot.p[1]);player.yaw=spot.yaw*Math.PI/180;player.pitch=spot.pitch??-.05;setBird(false);}
{const sp=H.spots[H.start||0];player.x=X(sp.p[0]);player.z=Z(sp.p[1]);player.yaw=sp.yaw*Math.PI/180;}
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;});addEventListener('keyup',e=>{keys[e.code]=false;});
const start=document.getElementById('start');
document.getElementById('sTitle').textContent=`${H.title} · ${H.subtitle}`;
document.getElementById('sGo').innerHTML=`<b>${U.start}</b>`;document.getElementById('sKeys').innerHTML=U.keys;
document.getElementById('sTouch').textContent=U.touch;document.getElementById('sCredit').textContent=H.credit||'';
let locked=false,started=false;
start.addEventListener('click',()=>{started=true;start.style.display='none';if(!isTouch&&!bird)canvas.requestPointerLock?.();});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;
  if(!locked&&!isTouch&&!bird&&started){document.getElementById('sGo').innerHTML=`<b>${U.resume}</b>`;start.style.display='flex';}});
document.addEventListener('mousemove',e=>{if(locked){player.yaw-=e.movementX*.0022;player.pitch=Math.max(-1.4,Math.min(1.4,player.pitch-e.movementY*.0022));}
  else if(bird&&drag){birdYaw-=e.movementX*.006;birdPitch=Math.max(.35,Math.min(1.45,birdPitch+e.movementY*.004));}});
let drag=false;canvas.addEventListener('mousedown',()=>{drag=true;});addEventListener('mouseup',()=>{drag=false;});
canvas.addEventListener('wheel',e=>{if(bird)birdR=Math.max(10,Math.min(60,birdR+e.deltaY*.02));},{passive:true});
// touch: left half = joystick, right half = look (or orbit in bird view)
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jt=null,jx=0,jy=0,jv=[0,0],lt=null,lx=0,ly=0;
canvas.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.clientX<innerWidth*.45&&jt===null&&!bird){jt=t.identifier;jx=t.clientX;jy=t.clientY;
  joy.style.display='block';joy.style.left=jx+'px';joy.style.top=jy+'px';}else if(lt===null){lt=t.identifier;lx=t.clientX;ly=t.clientY;}}e.preventDefault();},{passive:false});
canvas.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===jt){let dx=t.clientX-jx,dy=t.clientY-jy;const l=Math.hypot(dx,dy);if(l>45){dx*=45/l;dy*=45/l;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;jv=[dx/45,dy/45];}
  else if(t.identifier===lt){const dx=t.clientX-lx,dy=t.clientY-ly;lx=t.clientX;ly=t.clientY;
    if(bird){birdYaw-=dx*.008;birdPitch=Math.max(.35,Math.min(1.45,birdPitch+dy*.005));}
    else{player.yaw-=dx*.005;player.pitch=Math.max(-1.3,Math.min(1.3,player.pitch-dy*.005));}}}e.preventDefault();},{passive:false});
const tend=e=>{for(const t of e.changedTouches){if(t.identifier===jt){jt=null;jv=[0,0];joy.style.display='none';knob.style.transform='';}if(t.identifier===lt)lt=null;}};
canvas.addEventListener('touchend',tend);canvas.addEventListener('touchcancel',tend);

function blocked(x,z){for(const [a,b,c,d] of colliders)if(x>a-RAD&&x<c+RAD&&z>b-RAD&&z<d+RAD)return true;return false;}
function move(dt){let f=0,s=0;
  if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyD||keys.ArrowRight)s+=1;if(keys.KeyA||keys.ArrowLeft)s-=1;
  f-=jv[1];s+=jv[0];const l=Math.hypot(f,s);if(l<.05)return;if(l>1){f/=l;s/=l;}
  const sp=(keys.ShiftLeft||keys.ShiftRight?4.5:2.2)*dt,sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
  const dx=(-sy*f+cy*s)*sp,dz=(-cy*f-sy*s)*sp;
  if(!blocked(player.x+dx,player.z))player.x+=dx;if(!blocked(player.x,player.z+dz))player.z+=dz;
  player.x=Math.max(-60,Math.min(60,player.x));player.z=Math.max(-60,Math.min(60,player.z));}

// ---------- bird view ----------
let bird=false,birdYaw=.6,birdPitch=1.0,birdR=26;
const marker=new THREE.Mesh(new THREE.ConeGeometry(.35,.9,12),std(0xd8402f,{emissive:0x501008}));marker.rotation.x=Math.PI;marker.visible=false;scene.add(marker);

  const b=document.getElementById('bBird');if(b){b.textContent=v?U.walk:U.bird;b.classList.toggle('on',v);}
  document.getElementById('cross').style.display=v?'none':'block';}

// ---------- day / night ----------
let night=false;
function setNight(v){night=v;renderer.shadowMap.needsUpdate=true;scene.environment=v?null:envTex;scene.background.set(v?NIGHTSKY:DAYSKY);scene.fog.color.set(v?NIGHTSKY:DAYSKY);
  hemi.intensity=v?.12:1.15;amb.intensity=v?.06:.85;sun.intensity=v?.18:2.6;sun.color.set(v?0x8fa6d8:0xfff0d8);
  for(const l of roomLights){l.visible=v;l.intensity=v?9:0;}M.lamp.emissiveIntensity=v?2.2:.2;M.fire.emissiveIntensity=v?3:.6;
  renderer.toneMappingExposure=v?1.25:.95;const b=document.getElementById('bNight');b.textContent=v?U.night:U.day;b.classList.toggle('on',v);}

// ---------- buttons ----------
const bar=document.getElementById('bar');
for(const sp of H.spots){const b=document.createElement('button');b.textContent=sp.l;b.onclick=()=>{go(sp);started=true;start.style.display='none';if(!isTouch)canvas.requestPointerLock?.();};bar.appendChild(b);}
{const b=document.createElement('button');b.id='bNight';b.onclick=()=>setNight(!night);bar.appendChild(b);}
{const b=document.createElement('button');b.id='bBird';b.onclick=()=>{started=true;start.style.display='none';setBird(!bird);if(!bird&&!isTouch)canvas.requestPointerLock?.();};bar.appendChild(b);}

// ---------- HUD + minimap ----------
const hud=document.getElementById('hud');
const inRect=(px,py,[a,b,c,d])=>px>=a&&px<=c&&py>=b&&py<=d;
function where(){const px=PX(player.x),py=PY(player.z);
  for(const r of H.rooms)if(r.r.some(q=>inRect(px,py,q)))return `${r.n} · ${r.a} m²`;
  if(O.terrace&&inRect(px,py,O.terrace))return U.terrace;return `${H.title} · ${U.outside}`;}
const map=document.getElementById('map'),mg=map.getContext('2d');
const MB=[60,60,1960,1800],mk=Math.min((map.width-20)/(MB[2]-MB[0]),(map.height-20)/(MB[3]-MB[1]));
const mx=p=>10+(p-MB[0])*mk,my=p=>10+(p-MB[1])*mk;
function drawMap(){mg.clearRect(0,0,map.width,map.height);
  if(O.terrace){const [a,b,c,d]=O.terrace;mg.fillStyle='rgba(200,160,110,.35)';mg.fillRect(mx(a),my(b),(c-a)*mk,(d-b)*mk);}
  for(const r of H.rooms)for(const [a,b,c,d] of r.r){mg.fillStyle=r.f==='tile'?'rgba(170,200,220,.28)':'rgba(240,225,200,.28)';mg.fillRect(mx(a),my(b),(c-a)*mk,(d-b)*mk);}
  for(const w of mapWalls){if(w.win){const [a,b,c,d]=w.win;mg.fillStyle='rgba(140,200,255,.9)';mg.fillRect(mx(a),my(b),Math.max((c-a)*mk,1.5),Math.max((d-b)*mk,1.5));continue;}
    const [a,b,c,d]=w;mg.fillStyle='#f3f1ec';mg.fillRect(mx(a),my(b),Math.max((c-a)*mk,1.5),Math.max((d-b)*mk,1.5));}
  const px=mx(PX(player.x)),py=my(PY(player.z));
  if(px>-10&&px<map.width+10&&py>-10&&py<map.height+10){mg.save();mg.translate(Math.max(6,Math.min(map.width-6,px)),Math.max(6,Math.min(map.height-6,py)));
    mg.rotate(-player.yaw);mg.fillStyle='#e8b04a';mg.beginPath();mg.moveTo(0,-11);mg.lineTo(7,7);mg.lineTo(0,3);mg.lineTo(-7,7);mg.closePath();mg.fill();mg.restore();}}


// ---------- merge static geometry: ~900 meshes -> a few dozen draw calls ----------
function mergeStatic(root,skip=[]){root.updateMatrixWorld(true);const buckets=new Map(),kill=[];
  const visit=o=>{for(const ch of o.children){if(skip.includes(ch)||ch.userData.dynamic||ch.isInstancedMesh||ch.isLight)continue;
    if(ch.isMesh){const key=ch.material.uuid+'|'+ch.castShadow;let b=buckets.get(key);if(!b)buckets.set(key,b={m:ch.material,cast:ch.castShadow,g:[]});
      const g=ch.geometry.index?ch.geometry.toNonIndexed():ch.geometry.clone();for(const k of Object.keys(g.attributes))if(!['position','normal','uv'].includes(k))g.deleteAttribute(k);
      if(!g.attributes.uv)continue;g.applyMatrix4(ch.matrixWorld);b.g.push(g);kill.push(ch);}else visit(ch);}};
  visit(root);for(const ch of kill)ch.parent.remove(ch);
  for(const b of buckets.values()){const me=new THREE.Mesh(mergeGeometries(b.g,false),b.m);me.castShadow=b.cast;me.receiveShadow=true;root.add(me);}}
mergeStatic(scene,[roofGroup,ceilGroup,marker]);mergeStatic(roofGroup);mergeStatic(ceilGroup);
renderer.shadowMap.needsUpdate=true;
// adaptive quality: if the first seconds run slow, drop AO, then resolution
let perfN=0,perfT0=0,perfStage=0,pr=renderer.getPixelRatio();

// ---------- loop ----------
const clock=new THREE.Clock();let lastHud='',doorTick=0;
function frame(){const dt=Math.min(clock.getDelta(),.05);
  if(perfStage<9){const now=performance.now();if(!perfT0)perfT0=now;perfN++;if(now-perfT0>2000){const fps=perfN*1000/(now-perfT0);perfN=0;perfT0=now;
    if(fps<40&&pr>1){pr=Math.max(1,pr-.25);renderer.setPixelRatio(pr);}else if(fps<30&&renderer.shadowMap.enabled&&pr<=1){sun.castShadow=false;renderer.shadowMap.needsUpdate=true;}}}
  if(!bird)move(dt);
  for(const d of doors){const near=Math.hypot(player.x-d.cx,player.z-d.cz)<1.7&&!bird;d.open+=((near?1:0)-d.open)*Math.min(1,dt*5);
    const r=d.base+d.sgn*d.open*1.45;if(Math.abs(r-d.pivot.rotation.y)>.002){d.pivot.rotation.y=r;if(++doorTick%8===0)renderer.shadowMap.needsUpdate=true;}}
  if(bird){const cx=0,cz=-1.5;camera.position.set(cx+Math.sin(birdYaw)*Math.cos(birdPitch)*birdR,Math.sin(birdPitch)*birdR,cz+Math.cos(birdYaw)*Math.cos(birdPitch)*birdR);
    camera.lookAt(cx,0,cz);marker.position.set(player.x,1.4,player.z);}
  else{camera.position.set(player.x,EYE,player.z);camera.rotation.set(player.pitch,player.yaw,0);}
  const h=where();if(h!==lastHud){hud.textContent=h;lastHud=h;}
  drawMap();renderer.render(scene,camera);requestAnimationFrame(frame);}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
frame();
window.__walk={player,go,setNight,setBird,H,renderer,scene,sun,noAdapt(){perfStage=9;}};
